<!doctype html>
<meta charset="utf-8">
<title>Kiwi WebRTC probe: manual pairing</title>
<style>
  body { font: 14px system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; }
  textarea { width: 100%; height: 88px; font: 12px ui-monospace, monospace; }
  label { display: block; margin-top: 14px; font-weight: 600; }
  pre { background: #f4f4f4; padding: 10px; white-space: pre-wrap; }
  button { margin: 6px 6px 0 0; }
</style>
<h1>Manual pairing probe</h1>
<p>Throwaway feasibility tool, not part of Kiwi. Device A: <b>Create code</b>, send the code to device B by any means. Device B: paste it, <b>Use code</b>, send its reply back. Device A: paste the reply, <b>Use code</b>. The codes contain this device's network addresses.</p>
<label for="stun">STUN server (empty: none, local network only), e.g. <code>stun:stun.cloudflare.com:3478</code></label>
<input id="stun" size="48">
<div><button id="create">Create code</button></div>
<label for="mine">Your code (copy it to the other device)</label>
<textarea id="mine" readonly></textarea>
<label for="theirs">The other device's code</label>
<textarea id="theirs"></textarea>
<div><button id="use">Use code</button><button id="ping">Ping</button></div>
<label>Status</label>
<pre id="status">idle</pre>
<script src="shared.js"></script>
<script src="offscreen.js"></script>
<script src="pair.js"></script>
