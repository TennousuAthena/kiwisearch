name: Deploy site

# Publishes the website (apps/web: the search page at the root and the introduction, install, getting-started and privacy pages) to Cloudflare
# Pages, where it is served as kiwi.moe. Nothing here runs until the repository has the variable CLOUDFLARE_PAGES set to "true" and the secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, and the Pages project exists (docs/internals/web-app.md, "Hosting"). Not yet run: it was
# written without access to the account.

on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/app/**'
      - 'packages/protocol/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.CLOUDFLARE_PAGES == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Build and check
        run: |
          pnpm --filter @kiwi-search/web build
          pnpm --filter @kiwi-search/web check:dist

      # `wrangler` is not a dependency of the repository: it is only needed here.
      - name: Deploy kiwi.moe
        run: npx --yes wrangler@4 pages deploy apps/web/dist --project-name=kiwi-search --branch=main
