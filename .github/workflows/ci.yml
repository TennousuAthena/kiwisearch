name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The extension's postinstall runs `wxt prepare`, which generates the
      # .wxt/ files its tsconfig extends, so install must come before typecheck.
      - run: pnpm install --frozen-lockfile

      # Typecheck and the three test suites do not depend on each other, so a
      # failure in one must not hide the others. The root `pnpm test` is not
      # used: packages/experiments has no tests and exits 1.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test core
        if: ${{ !cancelled() }}
        run: pnpm --filter @kiwi-search/core test

      - name: Test extension
        if: ${{ !cancelled() }}
        run: pnpm --filter @kiwi-search/extension test

      - name: Test mcp
        if: ${{ !cancelled() }}
        run: pnpm --filter @kiwi-search/mcp test

      - name: Build extension
        run: pnpm --filter @kiwi-search/extension build

      - name: Build mcp server
        run: pnpm --filter @kiwi-search/mcp build

      - name: Upload the unpacked Chrome extension
        uses: actions/upload-artifact@v7
        with:
          name: kiwi-search-chrome-mv3
          path: apps/extension/.output/chrome-mv3
          if-no-files-found: error
          retention-days: 14
